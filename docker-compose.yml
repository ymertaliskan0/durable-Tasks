services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: durable
      POSTGRES_PASSWORD: durable
      POSTGRES_DB: durable_tasks
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable -d durable_tasks"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Workers and the nemesis harness are added in Milestone 5.

volumes:
  pgdata:
